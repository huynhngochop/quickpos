# Kiểm thử giao diện như người dùng (Maestro) trên Android emulator (điện thoại + máy tính bảng) và iOS Simulator.
# Bản dùng thử (không cần Supabase). Kết quả + ảnh chụp đẩy lên nhánh qa-<thiết bị>.
name: QA giao diện

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bản kiểm thử: khách "chuyển tiền" sau 30 giây để kịp thử xác nhận tay và hủy đơn
  EXPO_PUBLIC_DEMO_PAY_MS: "30000"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"

jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: android-phone
            profile: pixel_6
          - label: android-tablet
            profile: pixel_tablet
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: bash scripts/ci-run.sh setup bash scripts/setup.sh
      - run: bash scripts/ci-run.sh prebuild npx expo prebuild --platform android --clean
      - run: bash ../scripts/ci-run.sh gradle ./gradlew assembleRelease --no-daemon
        working-directory: android
      - name: Bật KVM cho emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Chạy Maestro trên emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/qa-android.sh ${{ matrix.label }}
      - name: Đẩy kết quả lên nhánh qa-${{ matrix.label }}
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/qa-publish.sh ${{ matrix.label }}

  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: bash scripts/ci-run.sh setup bash scripts/setup.sh
      - run: bash scripts/ci-run.sh prebuild-ios npx expo prebuild --platform ios --clean
      - name: Build cho Simulator
        run: |
          bash scripts/ci-run.sh xcodebuild xcodebuild -workspace ios/QuickPOS.xcworkspace -scheme QuickPOS \
            -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
      - run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Mở iPhone Simulator, cài app, chạy Maestro
        run: bash scripts/qa-ios.sh
      - name: Đẩy kết quả lên nhánh qa-ios
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/qa-publish.sh ios
