# Kiểm thử giao diện như người dùng (Maestro) trên Android emulator (điện thoại + máy tính bảng) và iOS Simulator.
# Bản dùng thử (không cần Supabase). Kết quả + ảnh chụp đẩy lên nhánh qa-<thiết bị>.
name: QA giao diện

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

env:
  # Bản kiểm thử: khách "chuyển tiền" sau 90 giây (máy ảo CI chậm) để kịp thử xác nhận tay và hủy đơn
  EXPO_PUBLIC_DEMO_PAY_MS: "90000"
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "180000"

jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: android-phone
            profile: pixel_6
          - label: android-tablet
            profile: medium_tablet
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: bash scripts/ci-run.sh setup bash scripts/setup.sh
      - run: bash scripts/ci-run.sh prebuild npx expo prebuild --platform android --clean
      - run: bash ../scripts/ci-run.sh gradle ./gradlew assembleRelease --no-daemon
        working-directory: android
      - name: Dọn ổ đĩa cho máy ảo (APK đã build xong)
        run: |
          df -h /
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          rm -rf android/app/build/intermediates android/build ~/.gradle/caches node_modules/.cache
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          mkdir -p android/app/build/outputs/apk/release
          cp "$RUNNER_TEMP/app-release.apk" android/app/build/outputs/apk/release/app-release.apk
          df -h /
      - name: Bật KVM cho emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Mở emulator và chạy Maestro
        run: bash scripts/android-emulator.sh ${{ matrix.label }} ${{ matrix.profile }}
      - name: Đẩy kết quả lên nhánh qa-${{ matrix.label }}
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/qa-publish.sh ${{ matrix.label }}

  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: bash scripts/ci-run.sh setup bash scripts/setup.sh
      - run: bash scripts/ci-run.sh prebuild-ios npx expo prebuild --platform ios --clean
      - name: Build cho Simulator
        run: |
          bash scripts/ci-run.sh xcodebuild xcodebuild -workspace ios/QuickPOS.xcworkspace -scheme QuickPOS \
            -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
      - run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      - name: Mở iPhone Simulator, cài app, chạy Maestro
        run: bash scripts/qa-ios.sh
      - name: Đẩy kết quả lên nhánh qa-ios
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/qa-publish.sh ios
