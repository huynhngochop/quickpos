appId: vn.quickpos.app
---
- runFlow: subflows/dismiss-system-dialogs.yaml
- assertVisible: "Hôm nay đã thu.*"
- tapOn: { id: "main-settings" }
# Vừa mở khóa PIN ở luồng trước (5 phút) nên vào thẳng; nếu hỏi PIN thì nhập
- runFlow:
    when:
      visible: "Mã PIN chủ quán"
    file: subflows/enter-pin.yaml
- extendedWaitUntil:
    visible: "Tài khoản nhận tiền"
    timeout: 10000
- assertVisible: "MB Bank · 0903456789"
- takeScreenshot: "50-cai-dat"

# Công tắc: tắt rồi bật lại
- tapOn: "Đọc to khi tiền về"
- tapOn: "Đọc to khi tiền về"
- tapOn: "Thu ngân được bấm “đã thấy tiền về”"
- tapOn: "Thu ngân được bấm “đã thấy tiền về”"
- tapOn: "Nghe thử giọng đọc"

# Cỡ chữ rất lớn: các màn hình chính vẫn hiện đủ
- tapOn: "Rất lớn"
- takeScreenshot: "51-chu-rat-lon"
- tapOn: "Trang chính"
- extendedWaitUntil:
    visible: "Hôm nay đã thu.*"
    timeout: 10000
- takeScreenshot: "52-trang-chinh-chu-rat-lon"
- runFlow: subflows/open-thu-tien.yaml
- tapOn: { id: "key-9" }
- tapOn: { id: "key-000" }
- assertVisible: "9.000 đ"
- assertVisible: "Hiện mã QR"
- takeScreenshot: "53-thu-tien-chu-rat-lon"
- tapOn: { id: "key-del" }
- tapOn: { id: "key-del" }
- tapOn: { id: "key-del" }
- tapOn: { id: "key-del" }
- tapOn: "Trang chính"
- tapOn: { id: "main-settings" }
- runFlow:
    when:
      visible: "Mã PIN chủ quán"
    file: subflows/enter-pin.yaml
- extendedWaitUntil:
    visible: "Cỡ chữ"
    timeout: 10000
- tapOn: "Lớn"

# Nhân viên
- tapOn: "Nhân viên.*"
- extendedWaitUntil:
    visible: "Chủ quán"
    timeout: 10000
- assertVisible: "Bạn"
- takeScreenshot: "54-nhan-vien"
- scrollUntilVisible:
    element: "Quay lại"
    direction: UP
- tapOn: "Quay lại"

# Báo tiền khi tắt màn hình
- scrollUntilVisible:
    element: "Báo tiền khi tắt màn hình.*"
- tapOn: "Báo tiền khi tắt màn hình.*"
- extendedWaitUntil:
    visible: "Để máy báo tiền cả khi tắt màn hình"
    timeout: 10000
- assertVisible: "Cho phép thông báo"
- takeScreenshot: "55-pin-nen"
- tapOn: "Cài đặt"

# Xóa tài khoản: nút khóa đến khi đánh dấu, "Không xóa nữa" quay lại
- scrollUntilVisible:
    element: "Xóa tài khoản"
- tapOn: "Xóa tài khoản"
- extendedWaitUntil:
    visible: "Xóa tài khoản của bạn"
    timeout: 10000
- assertVisible: "Bạn là chủ quán"
- takeScreenshot: "56-xoa-tai-khoan"
- tapOn: "Không xóa nữa"

# Đăng xuất (nút cuối cùng của Cài đặt) → đăng nhập lại → vẫn còn quán
- scrollUntilVisible:
    element: "Đăng xuất khỏi máy này"
    visibilityPercentage: 100
- takeScreenshot: "56b-dang-xuat-cuoi-cai-dat"
- tapOn: "Đăng xuất khỏi máy này"
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible: "Hôm nay đã thu.*"
    timeout: 20000
- assertVisible: "Quan Co Ba"
- takeScreenshot: "57-dang-nhap-lai"

# Xóa tài khoản thật
- tapOn: { id: "main-settings" }
- runFlow:
    when:
      visible: "Mã PIN chủ quán"
    file: subflows/enter-pin.yaml
- scrollUntilVisible:
    element: "Xóa tài khoản"
- tapOn: "Xóa tài khoản"
# Ô đánh dấu nằm dưới, có thể bị nút cuối màn hình che: cuộn tới
- scrollUntilVisible:
    element: "Tôi hiểu và muốn xóa tài khoản"
    visibilityPercentage: 100
# iOS coi ô bị nút đáy che là "đã thấy": cuộn thêm tới cuối trang
- scroll
- scroll
- tapOn: "Tôi hiểu và muốn xóa tài khoản"
- extendedWaitUntil:
    visible: "Xóa tài khoản của tôi"
    timeout: 5000
- tapOn: "Xóa tài khoản của tôi"
- extendedWaitUntil:
    visible: "Nhập số điện thoại của quán"
    timeout: 15000
- takeScreenshot: "58-sau-khi-xoa"
