    timeout: 10000
- assertVisible: "40 điểm"
- tapOn: { id: "redeem-points" }
- inputText: "10"
- tapOn: "Điểm hiện có"
- scrollUntilVisible:
    element: "Trừ điểm"
- tapOn: "Trừ điểm"
- extendedWaitUntil:
    visible: "✓ Đã trừ điểm"
    timeout: 10000
- scrollUntilVisible:
    element: "30 điểm"
    direction: UP
- takeScreenshot: "110-doi-diem"
- scrollUntilVisible:
    element: "Khách quen"
    direction: UP
- tapOn: "Khách quen"
- extendedWaitUntil:
    visible: "Thêm khách quen"
    timeout: 10000
- tapOn: "Trang chính"
- extendedWaitUntil:
    visible: "Hôm nay đã thu.*"
    timeout: 10000
- scrollUntilVisible:
    element: "Việc khác.*"
- tapOn: "Việc khác.*"
- extendedWaitUntil:
    visible: "Ca bán và két tiền.*"
    timeout: 10000
- tapOn: "Ca bán và két tiền.*"
- extendedWaitUntil:
    visible: "Mở ca"
    timeout: 10000
- tapOn: { id: "shift-cash" }
- inputText: "100000"
- tapOn: "Tiền mặt có sẵn trong két (đồng)"
- scrollUntilVisible:
    element: "Mở ca"
- tapOn:
    text: "Mở ca"
    index: 1
- extendedWaitUntil:
    visible: "Ca đang mở từ.*"
    timeout: 10000
- assertVisible: "Trong két phải có"
- takeScreenshot: "111-ca-dang-mo"
- tapOn: { id: "shift-cash" }
- inputText: "100000"
