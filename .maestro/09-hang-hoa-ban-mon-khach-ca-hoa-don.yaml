- tapOn: "Nhân viên.*"
- runFlow:
    when:
      visible: "Mã PIN chủ quán"
    file: subflows/enter-pin.yaml
- extendedWaitUntil:
    visible: "Mời nhân viên"
    timeout: 10000
- tapOn: { id: "invite-phone" }
- inputText: "0903000002"
- tapOn: "Số điện thoại của nhân viên"
- scrollUntilVisible:
    element: "Gửi lời mời"
- tapOn: "Gửi lời mời"
- extendedWaitUntil:
