appId: vn.quickpos.app
---
# Bản kiểm thử nạp 1 triệu đơn cũ (EXPO_PUBLIC_DEMO_BULK_ORDERS), rải 365 ngày tính từ hôm kia trở về trước:
# mỗi ngày ~2.740 đơn, tổng tháng hàng tỷ đồng. Kiểm tra sổ mở nhanh, số lớn không vỡ chữ, xem thêm nhiều trang.
- runFlow: subflows/dismiss-system-dialogs.yaml
- assertVisible: "Hôm nay đã thu.*"
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Sổ hôm nay"
      - extendedWaitUntil:
          visible: "Tổng đã thu"
          timeout: 10000
- tapOn: "‹ Ngày trước"
- tapOn: "‹ Ngày trước"
# Ngày có ~2.740 đơn: tổng và số đơn hiện trong 10 giây
- extendedWaitUntil:
    visible: "2\\.[67][0-9]{2} đơn"
    timeout: 10000
- assertVisible: "Chuyển khoản"
- assertVisible: "Tiền mặt"
- takeScreenshot: "70-so-ngay-nhieu-don"
# Cả tháng: hàng trăm triệu đến hàng tỷ đồng, hàng chục nghìn đơn, có dấu chấm ngăn cách
- scrollUntilVisible:
    element: "Cả tháng này"
    timeout: 10000
- assertVisible: "[0-9]{1,3}(\\.[0-9]{3}){2,} đ · [0-9]{1,3}(\\.[0-9]{3})* đơn"
- takeScreenshot: "71-ca-thang-so-lon"
# Xem thêm 5 trang (20 đơn/trang): mỗi lần bấm đều tải được
- repeat:
    times: 5
    commands:
      - scrollUntilVisible:
          element: "Xem thêm đơn"
          timeout: 20000
      - tapOn: "Xem thêm đơn"
      - waitForAnimationToEnd
- scrollUntilVisible:
    element: "Xem thêm đơn"
    timeout: 20000
- takeScreenshot: "72-sau-5-trang"
# Quay về hôm nay: số liệu hôm nay không lẫn đơn cũ
- scrollUntilVisible:
    element: "Ngày sau ›"
    direction: UP
    timeout: 20000
- tapOn: "Ngày sau ›"
- tapOn: "Ngày sau ›"
- extendedWaitUntil:
    visible: "Hôm nay"
    timeout: 10000
- assertNotVisible: "2\\.[67][0-9]{2} đơn"
- takeScreenshot: "73-ve-hom-nay"
- tapOn: "Trang chính"
- extendedWaitUntil:
    visible: "Hôm nay đã thu.*"
    timeout: 10000
