appId: vn.quickpos.app
tags: [smoke]
---
- launchApp:
    clearState: true
- runFlow: subflows/dismiss-system-dialogs.yaml
- runFlow: subflows/login.yaml

# 7.1 Đồng ý xử lý dữ liệu: nút khóa đến khi đánh dấu
- extendedWaitUntil:
    visible: "QuickPOS dùng thông tin của quán thế nào"
    timeout: 15000
- assertVisible: "Đánh dấu “Tôi đồng ý” để tiếp tục"
- takeScreenshot: "04-dong-y"
- tapOn: "Tôi đã đọc và đồng ý"
- tapOn: "Đồng ý và tiếp tục"

# Bước 1/3 Thông tin quán: thử để trống rồi điền đúng
- extendedWaitUntil:
    visible: "Thông tin quán"
    timeout: 15000
- tapOn: "Tiếp tục"
- assertVisible: "Nhập tên quán."
- takeScreenshot: "05-quan-loi"
- tapOn: { id: "field-name" }
- waitForAnimationToEnd
- inputText: "Quan Co Ba"
- tapOn:
    text: "Thông tin quán"
    optional: true
# Chạm vào chữ (không phải ô nhập) để ẩn bàn phím — máy tính bảng nằm ngang: tiêu đề đã bị đẩy khỏi màn hình
- tapOn:
    text: "Mã số thuế của hộ"
    optional: true
- tapOn: { id: "field-taxCode" }
- waitForAnimationToEnd
- inputText: "123"
- tapOn:
    text: "Thông tin quán"
    optional: true
# Chạm vào chữ (không phải ô nhập) để ẩn bàn phím — máy tính bảng nằm ngang: tiêu đề đã bị đẩy khỏi màn hình
- tapOn:
    text: "Mã số thuế của hộ"
    optional: true
- tapOn: "Tiếp tục"
# Máy tính bảng nằm ngang: bàn phím che phần dưới, cuộn tới dòng báo lỗi
- scrollUntilVisible:
    element: "Mã số thuế gồm 10 hoặc 12 số.*"
    timeout: 10000
- tapOn:
    text: "Thông tin quán"
    optional: true
# Chạm vào chữ (không phải ô nhập) để ẩn bàn phím — máy tính bảng nằm ngang: tiêu đề đã bị đẩy khỏi màn hình
- tapOn:
    text: "Mã số thuế của hộ"
    optional: true
- tapOn: { id: "field-taxCode" }
- waitForAnimationToEnd
- eraseText: 5
- inputText: "0312345678"
- tapOn:
    text: "Thông tin quán"
    optional: true
# Chạm vào chữ (không phải ô nhập) để ẩn bàn phím — máy tính bảng nằm ngang: tiêu đề đã bị đẩy khỏi màn hình
- tapOn:
    text: "Mã số thuế của hộ"
    optional: true
- scrollUntilVisible:
    element:
      id: "field-address"
- tapOn: { id: "field-address" }
- waitForAnimationToEnd
- inputText: "12 Le Loi, Quan 1"
- tapOn:
    text: "Thông tin quán"
    optional: true
# Chạm vào chữ (không phải ô nhập) để ẩn bàn phím — máy tính bảng nằm ngang: tiêu đề đã bị đẩy khỏi màn hình
- tapOn:
    text: "Mã số thuế của hộ"
    optional: true
- takeScreenshot: "06-quan-dien-xong"
- tapOn: "Tiếp tục"

# Bước 2/3 Tài khoản nhận tiền (bản thử có sẵn MB Bank)
- extendedWaitUntil:
    visible: "Đã tìm thấy tài khoản"
    timeout: 15000
- takeScreenshot: "07-tai-khoan"
- tapOn: "Đúng, dùng tài khoản này"

# Bước 3/3 PIN: mã dễ đoán bị từ chối, nhập lại sai bị từ chối, rồi đúng
- extendedWaitUntil:
    visible: "Tạo mã PIN 4 số cho chủ quán"
    timeout: 10000
- tapOn: { id: "key-1" }
- tapOn: { id: "key-2" }
- tapOn: { id: "key-3" }
- tapOn: { id: "key-4" }
- assertVisible: "Mã này dễ đoán quá.*"
- runFlow: subflows/enter-pin.yaml
- assertVisible: "Nhập lại mã PIN để chắc chắn"
- tapOn: { id: "key-9" }
- tapOn: { id: "key-9" }
- tapOn: { id: "key-7" }
- tapOn: { id: "key-1" }
- assertVisible: "Hai lần nhập chưa giống nhau.*"
- runFlow: subflows/enter-pin.yaml
- runFlow: subflows/enter-pin.yaml

# 2.1 Trang chính
- extendedWaitUntil:
    visible: "Hôm nay đã thu.*"
    timeout: 15000
- assertVisible: "Quan Co Ba"
- assertVisible: ".*130.000 đ.*"
- assertVisible: "Thu tiền"
- assertVisible: "Sổ hôm nay"
# Cài đặt, Thoát là nút biểu tượng (Thoát chỉ có trên Android — iOS không cho app tự đóng)
- assertVisible: { id: "main-settings" }
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: { id: "main-exit" }
- takeScreenshot: "08-trang-chinh"
# Các ô việc: báo cáo, sổ nợ, hàng hóa, chi tiêu, việc khác (cuộn nếu màn hình nhỏ)
- scrollUntilVisible:
    element: "Việc khác.*"
- assertVisible: "Báo cáo"
- assertVisible: "Sổ nợ.*"
- assertVisible: "Hàng hóa"
- assertVisible: "Chi tiêu.*"
- takeScreenshot: "09-trang-chinh-o-viec"
# Về đầu trang chính cho các luồng sau (nút "Cài đặt", "Thoát" ở trên cùng)
- scrollUntilVisible:
    element:
      id: "main-settings"
    direction: UP
